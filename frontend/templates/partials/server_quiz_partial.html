{% if quiz_content is not None and quiz_content.quiz is not None %}
    {% for item in quiz_content.quiz %}
        <div class="quiz-item mb-3" data-question-id="{{ forloop.counter }}" data-correct-answer="{{ item.answer }}">
            <p class="text-primary mb-1">
                {{ forloop.counter }}. {{ item.question }}
            </p>
            {% for key, value in item.options.items %}
                <label class="form-check mb-0">
                    <input 
                    id="question_{{ forloop.parentloop.counter }}_{{ key }}"
                    class="form-check-input"
                    type="radio"
                    name="question_{{ forloop.parentloop.counter }}"
                    value="{{ key }}">
                    <span class="form-check-label">
                        {{ key|upper }}. {{ value }}
                    </span>
                </label>
            {% endfor %}
        </div>
    {% endfor %}
    <div class="text-center">
        <button id="submit-quiz" class="btn btn-primary" type="submit">Submit</button>
        <p id="quiz-result" class="mt-3" aria-live="polite"></p>
    </div>
{% else %}
    <h3 class="text-danger text-center">No quiz content available</h3>
{% endif %}
</div>
