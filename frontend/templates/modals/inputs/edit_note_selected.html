<div id="editNoteSelectedModal" class="modal fade" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit your note</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editNoteSelectedForm" data-input-modal="editNoteSelectedModal" hx-post="{% url 'api:update_note' %}" hx-target="#serverResponseContent" hx-swap="innerHTML" hx-encoding="application/x-www-form-urlencoded">
                    {% csrf_token %}
                    <input type="hidden" id="editNoteId" name="note_id" value="">
                    <div class="mb-3">
                        <label for="editNote" class="form-label">Note</label>
                        <textarea id="editNote" name="note" class="form-control" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>
