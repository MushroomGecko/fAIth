<div id="mapSearchModal" class="modal fade" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Searching for maps...</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="mapSearchForm" data-input-modal="mapSearchModal" hx-post="{% url 'api:map_search' %}" hx-target="#serverResponseContent" hx-swap="innerHTML" hx-encoding="application/x-www-form-urlencoded">
                    {% csrf_token %}
                    <input type="hidden" name="selected_text" value="">
                    <input type="hidden" name="verses_text" value="">
                    <input type="hidden" name="book" value="{{ book }}">
                    <input type="hidden" name="chapter" value="{{ chapter }}">
                    <input type="hidden" name="collection_name" value="{{ version }}">
                    <button type="submit" id="mapSearchSubmit" style="display: none;"></button>
                </form>
            </div>
        </div>
    </div>
</div>
